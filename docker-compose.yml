name: notes

services:
  notes:
    build:
      context: .
      dockerfile: Dockerfile
    image: notes:production
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3001
      NOTES_DB: /app/data/notes.sqlite
      NOTES_HTTPS: "0"
      NOTES_IDLE_MINUTES: ${NOTES_IDLE_MINUTES:-15}
    volumes:
      - notes_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  notes_data:
