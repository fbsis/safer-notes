name: notes-production

services:
  notes:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NOTES_IMAGE:-notes:production}
    init: true
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3001
      NOTES_DB: /app/data/notes.sqlite
      NOTES_HTTPS: ${NOTES_HTTPS:-0}
      NOTES_IDLE_MINUTES: ${NOTES_IDLE_MINUTES:-15}
    volumes:
      - notes_data:/app/data
    ports:
      - "${NOTES_BIND_ADDRESS:-127.0.0.1}:${NOTES_PORT:-3001}:3001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  notes_data:
